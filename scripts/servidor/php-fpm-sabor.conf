; Se copia a /etc/php/8.3/fpm/pool.d/zz-sabor.conf
; Ajusta el grupo de procesos "www" de PHP-FPM (el "zz" hace que se lea el último
; y sus valores sustituyan a los de www.conf).
;
; Ubuntu trae pm.max_children = 5: con más de 5 peticiones PHP a la vez, el resto
; espera en cola. El servidor tiene 8 GB de RAM y cada proceso usa ~30-40 MB:
; 40 procesos son ~1,5 GB como mucho y queda memoria de sobra para MariaDB y Redis.
[www]
pm = dynamic
pm.max_children = 40
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
; Cada proceso se renueva tras 1000 peticiones (evita que crezca la memoria con el tiempo)
pm.max_requests = 1000


