# Se copia a /etc/ssh/sshd_config.d/99-sabor.conf
# Endurecimiento de SSH (en este archivo los comentarios van siempre en su propia línea)

# Nadie entra como root: se entra con vuestro usuario y se usa sudo
PermitRootLogin no
# 4 intentos de contraseña por conexión y 30 segundos para escribirla
MaxAuthTries 4
LoginGraceTime 30
# No hace falta entorno gráfico
X11Forwarding no
# Cerrar sesiones abandonadas tras 10 minutos sin respuesta
ClientAliveInterval 300
ClientAliveCountMax 2
